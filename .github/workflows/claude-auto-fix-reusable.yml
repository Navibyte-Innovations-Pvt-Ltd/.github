name: Claude Auto-Fix Issues (Reusable)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  auto-fix:
    # Only trusted actors may burn the org's Claude subscription on a self-hosted runner.
    # Public repos fire `issues: [opened]` for anyone; this is the gate.
    if: contains(fromJSON('["WebNaresh", "glitchgrab-app[bot]"]'), github.actor)
    runs-on: self-hosted
    # Same group as claude-ci-fix-reusable.yml (keyed by the branch this job
    # pushes), so the CI-failure fixer waits while this job watches its own PR.
    concurrency:
      group: claude-branch-claude/issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun & install
        uses: WebNaresh/bun-setup-action@v1
        with:
          bun-version: "1.3.7"
          frozen-lockfile: "false"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # write, so a check that failed for a reason outside the code can be
          # re-run by the job itself (step 9).
          additional_permissions: |
            actions: write
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch"
          prompt: |
            Issue #${{ github.event.issue.number }} was just opened.

            Title: ${{ github.event.issue.title }}
            Author: ${{ github.event.issue.user.login }}
            Assignees: ${{ join(github.event.issue.assignees.*.login, ',') }}

            Body:
            ${{ github.event.issue.body }}

            STEP 1 — TRIAGE (mandatory, do this FIRST):
            Decide whether this issue is a "simple bug fix" that you should auto-fix, or a "broader change" that needs human intervention. Err on the side of bailing out — if in doubt, do NOT open a PR.

            Auto-fix ONLY if ALL of these are true:
            - It is a clearly described bug with a reproducible symptom, a copy/text change, or a small UI tweak.
            - The fix is confined to a small number of files and a localized code region.
            - It requires NO Prisma schema changes, NO database migrations, NO changes under `prisma/`, and NO changes to `.env` / env var names.
            - It requires NO new API route, NO new module, NO new page, and NO new dependency (no changes to `package.json` dependencies).
            - It requires NO changes to auth, billing/Razorpay, subscription logic, caching/`lib/prisma.cache.tags.ts`, CI workflows (`.github/`), or build/config files (`next.config.*`, `turbo.json`, `tsconfig.json`).
            - It does NOT touch more than ~5 files or ~150 lines total.
            - The expected behavior is unambiguous from the issue body — no design decisions, no product judgment calls required.

            DO NOT auto-fix (bail out) if ANY of these are true:
            - Schema / migration / database structure changes are implied.
            - It is a feature request, refactor, architectural change, or "broader" rework.
            - It spans multiple modules or requires cross-cutting changes.
            - It touches auth, payments, subscriptions, email/WhatsApp templates, or security-sensitive logic.
            - The issue is vague, ambiguous, lacks repro steps, or needs clarification.
            - Fixing it safely would require human product/design judgment.

            If you decide to bail out: post ONE comment on the issue explaining that this looks like a broader change needing human intervention, briefly state why (schema change / feature / ambiguous / etc.), assign the issue to the repo owner with `gh issue edit ${{ github.event.issue.number }} --add-assignee ${{ github.repository_owner }}`, and STOP. Do NOT create a branch, do NOT open a PR.

            STEP 2 — FIX (only if triage passed):
            1. Investigate the issue. Read relevant code and confirm the bug before making changes.
            2. Create and switch to a new branch named `claude/issue-${{ github.event.issue.number }}` based on `main`.
            3. Implement the fix. Follow existing code style and patterns in the repo.
            4. Run `bun run validate` and `bun run build` from the repo root. If anything fails, fix it before committing. These may not cover every CI job (end-to-end tests often run only in CI), so step 9 is not optional.
            5. Commit each changed file individually using conventional commit format (e.g. `fix(proposals): ...`). Do NOT add any Co-Authored-By or Claude attribution lines.
            6. Push the branch to origin.
            7. Open a pull request targeting `main` using `gh pr create`. Include the line `Closes #${{ github.event.issue.number }}` in the PR body so GitHub auto-closes the issue when the PR merges. Pass `--assignee` with the issue's assignees (comma-separated). If the issue has no assignees, use the issue author `${{ github.event.issue.user.login }}` as the assignee.
            8. Post a single comment on the issue linking to the new PR.
            9. Wait for the PR's checks: `gh pr checks <pr-number> --watch --interval 30`. A PR is done when its checks are green, not when it is opened. If one fails: read it (`gh run view <run-id> --log-failed`, `gh run download <run-id>`), name the cause, and fix it on this branch — including when the failure is pre-existing or flaky and not caused by your diff. Re-run (`gh run rerun <run-id> --failed`) only after naming a cause outside any code, never for a failure you have not explained. Push the fix and watch again. Each round that fixes or re-runs something posts ONE comment on the PR whose first line is exactly `<!-- claude-ci-fix sha=<the commit the failed run tested> -->`, then which check failed, the cause, and what changed. `claude-ci-fix-reusable.yml` counts those markers, so this job and that one share one budget of two rounds per PR. Before a round, count the markers already on the PR; at two, stop — the last comment must say what a human has to decide.
            10. NEVER run `gh pr merge` — the repo owner handles merging.

            If at any point during the fix you discover the change is broader than the triage suggested (e.g. you need a schema change, a new dependency, or design decisions), STOP, discard the branch, post a comment on the issue explaining this needs human intervention, and assign the issue to the repo owner with `gh issue edit ${{ github.event.issue.number }} --add-assignee ${{ github.repository_owner }}`.
