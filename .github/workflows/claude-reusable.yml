name: Claude Code (Reusable)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # write, so a failed check can be re-run by the bot itself instead of
          # being handed back as "please click re-run".
          additional_permissions: |
            actions: write
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch"
          prompt: |
            You were tagged via @claude on ${{ github.event_name }} in repo ${{ github.repository }}.

            Follow the user's instructions in the triggering comment/issue/review.

            If the task requires code changes on an issue (not already on a PR branch):
            1. Create a branch named `claude/issue-${{ github.event.issue.number }}` (or a unique name if that exists).
            2. Implement the fix following existing code style.
            3. Commit each changed file individually using conventional commit format (e.g. `fix(scope): ...`). Never add Co-Authored-By or any Claude attribution.
            4. Push the branch to origin.
            5. Open a pull request to the default branch using `gh pr create`. Put `Closes #${{ github.event.issue.number }}` in the PR body so the issue auto-closes on merge. Pass `--assignee` with the issue's assignees (comma-separated list from `${{ join(github.event.issue.assignees.*.login, ',') }}`). If that list is empty, use the issue author `${{ github.event.issue.user.login }}`.
            6. Post a single comment on the issue linking to the PR.
            7. NEVER run `gh pr merge` — the repo owner handles merging.

            If the task is on an existing PR (review/comment), push commits to that PR's branch directly; do not open a new PR.

            Failing checks. When asked about failing checks, validation, CI, or "it is still failing", the task is done only when those checks are green — a diagnosis alone is not done, and "not caused by this PR" is not out of scope.
            1. Read the failing job's log and artifacts and name the cause.
            2. If the diff caused it, fix it on this branch.
            3. If it is pre-existing or flaky, fix the root cause anyway — on this branch when small, otherwise open a separate PR and link it — and do not ask the user to re-run it.
            4. Re-run only after naming a cause outside the diff (runner outage, network, a fix merged elsewhere): `gh run rerun <run-id> --failed`. Never re-run a failure you have not explained, and never re-run the same failure twice.
            5. Watch the run (`gh run watch <run-id> --exit-status`) and report the result. If it is still red, go back to step 1 in the same run — do not stop and wait to be asked again.
            6. If a re-run is refused ("Resource not accessible by integration"), say so in one line and keep going with the fix; the user clicking re-run is the last resort, never the plan.
            The "cannot solve the task" escape below applies only to failing checks after the steps above were tried, and the comment must say what was tried.

            If you cannot solve the task (ambiguous, out of scope, requires human judgment, or you hit a blocker): post ONE comment on the issue/PR explaining why, and — only if the trigger is an issue — assign it to the repo owner with `gh issue edit ${{ github.event.issue.number }} --add-assignee ${{ github.repository_owner }}`. Do NOT open a PR.
