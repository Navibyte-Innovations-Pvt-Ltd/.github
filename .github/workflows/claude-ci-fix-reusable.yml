name: Claude CI Fix (Reusable)

# A PR the bot opened used to sit red until someone typed "@claude the checks
# are failing". The auto-fix runs the repo's validation before opening a PR, but
# CI can run jobs that gate cannot reproduce (practise_stack's Cypress dark-mode
# audit needs its own database and server), and nothing watched the PR once it
# was open.
#
# Called from a repo's `claude-ci-fix.yml` on `workflow_run` of its CI. Picks a
# red `claude/*` branch back up: read the failed job, fix the cause, push. At
# most two rounds per PR, counted by the marker comment each round leaves — the
# auto-fix's own rounds carry the same marker, so both share one budget.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  fix:
    # Same-repo `claude/*` branches only, and only runs started by a trusted
    # actor — public repos run CI for anyone's push.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push') &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["WebNaresh", "claude[bot]", "glitchgrab-app[bot]"]'), github.event.workflow_run.triggering_actor.login)
    runs-on: self-hosted
    # Same group as claude-auto-fix-reusable.yml, so this waits while the
    # auto-fix that opened the PR is still watching its own checks.
    concurrency:
      group: claude-branch-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Find the PR and decide whether to act
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,headRefOid --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for this branch."; echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          # Something was pushed after this run started — that push has its own run.
          if [ "$head" != "$RUN_SHA" ]; then
            echo "PR head moved past $RUN_SHA; skipping."; echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          markers=$(gh api "repos/$REPO/issues/$number/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- claude-ci-fix")) | .body | split("\n")[0]')
          # A push and a pull_request CI run can both fail for one commit; one round covers both.
          if grep -q "sha=$RUN_SHA" <<<"$markers"; then
            echo "This commit already had a round."; echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          attempts=$(grep -c "claude-ci-fix" <<<"$markers" || true)
          if [ "$attempts" -ge 2 ]; then
            echo "Already tried $attempts times; leaving it for a human."; echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          failed=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          {
            echo "act=true"
            echo "number=$number"
            echo "attempt=$((attempts + 1))"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the PR branch
        if: steps.pr.outputs.act == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Bun & install
        if: steps.pr.outputs.act == 'true'
        uses: WebNaresh/bun-setup-action@v1
        with:
          bun-version: "1.3.7"
          frozen-lockfile: "false"

      - name: Run Claude
        if: steps.pr.outputs.act == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The CI run was usually started by the bot's own push, so the actor is
          # the Claude app. The action refuses bot actors unless listed.
          allowed_bots: claude,glitchgrab-app
          # write, so a failure with a cause outside the code can be re-run here.
          additional_permissions: |
            actions: write
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch"
          prompt: |
            CI failed on PR #${{ steps.pr.outputs.number }} in ${{ github.repository }}
            (run ${{ github.event.workflow_run.id }}, commit ${{ github.event.workflow_run.head_sha }}).
            Failed jobs: ${{ steps.pr.outputs.failed }}.
            This is round ${{ steps.pr.outputs.attempt }} of 2.

            Your job is done only when these checks are green. A diagnosis alone is not done,
            and "not caused by this PR" is not out of scope. Nobody asked you to do this —
            the point is that nobody has to.

            1. Read the failed job's log (`gh run view ${{ github.event.workflow_run.id }} --log-failed`)
               and download its artifacts (`gh run download ${{ github.event.workflow_run.id }}`).
               Name the cause from evidence, not a guess.
            2. If the PR's diff caused it, fix it on this branch.
            3. If it is pre-existing or flaky, fix the root cause anyway — on this branch when it
               is small, otherwise open a separate PR to the default branch and link it.
            4. Re-run only after naming a cause outside any code (runner outage, network, a fix
               merged elsewhere): `gh run rerun ${{ github.event.workflow_run.id }} --failed`.
               Never re-run a failure you have not explained.
            5. Before pushing, run the same checks the failed CI job runs, locally, where the
               repo can run them. Commit each changed file individually, conventional commit
               format, no Co-Authored-By or Claude attribution. Push to this branch. The push
               starts a new CI run; this workflow picks it up again if that one fails too.
            6. Post exactly ONE comment on PR #${{ steps.pr.outputs.number }}. Its first line must be
               exactly `<!-- claude-ci-fix sha=${{ github.event.workflow_run.head_sha }} -->` — that
               marker is how rounds are counted. Then say in plain words: which check failed, the
               cause, what you changed (or re-ran), and on round 2, if it is still not fixed,
               exactly what a human has to decide.
            7. NEVER run `gh pr merge` or `gh issue close`.
